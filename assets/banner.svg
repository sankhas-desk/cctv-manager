<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Service Manager - jobs, reports, invoices and vehicle mileage" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Service Manager v2.0</title>
  <defs>
    <linearGradient id="glow" x1="0" x2="1">
      <stop offset="0" stop-color="#e31e24" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e31e24"/>
      <stop offset="1" stop-color="#e31e24" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="900" height="240" rx="18"/></clipPath>
  </defs>
  <style>
    text{font-family:'Segoe UI',Inter,Arial,sans-serif}
    .rise{animation:rise .9s ease-out both}
    .d1{animation-delay:.1s}.d2{animation-delay:.5s}.d3{animation-delay:.9s}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .road{stroke:#5b5f64;stroke-width:3;stroke-dasharray:22 16;animation:road 1s linear infinite}
    @keyframes road{to{stroke-dashoffset:-38}}
    .van{animation:drive 9s linear infinite}
    @keyframes drive{from{transform:translateX(-130px)}to{transform:translateX(930px)}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin .6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .bounce{animation:bounce .35s ease-in-out infinite alternate}
    @keyframes bounce{to{transform:translateY(-1.5px)}}
    .sweep{animation:sweep 4s ease-in-out infinite}
    @keyframes sweep{0%{transform:translateX(-500px)}100%{transform:translateX(900px)}}
    .live{animation:live 1.4s ease-in-out infinite}
    @keyframes live{0%,100%{opacity:1}50%{opacity:.25}}
    .tick{animation:tick 1.2s steps(1) infinite}
    @keyframes tick{50%{opacity:0}}
  </style>

  <g clip-path="url(#card)">
    <rect width="900" height="240" fill="#0a0a0a"/>
    <!-- soft red glow top-left -->
    <circle cx="80" cy="30" r="170" fill="#e31e24" opacity=".08"/>
    <!-- sweeping light line -->
    <rect class="sweep" x="0" y="232" width="500" height="4" fill="url(#glow)"/>
    <rect x="0" y="236" width="900" height="4" fill="#e31e24"/>

    <!-- title block -->
    <g class="rise d1"><text x="50" y="92" font-size="54" font-weight="700" fill="#ffffff">Service Manager</text></g>
    <g class="rise d2"><text x="52" y="128" font-size="19" fill="#a8abb0">Jobs  ·  Reports  ·  Invoices  ·  Vehicle mileage</text></g>

    <!-- version pill + live dot -->
    <g class="rise d3">
      <rect x="52" y="146" width="74" height="28" rx="14" fill="#e31e24"/>
      <text x="89" y="165" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">v2.0</text>
      <circle class="live" cx="150" cy="160" r="5" fill="#1e9e57"/>
      <text x="162" y="165" font-size="13" fill="#a8abb0">live on GitHub Pages</text>
    </g>

    <!-- odometer decoration -->
    <g class="rise d3">
      <rect x="660" y="40" width="200" height="42" rx="8" fill="#161616" stroke="#2c2c2c"/>
      <text x="760" y="68" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">045 286 <tspan class="tick" fill="#e31e24">km</tspan></text>
    </g>

    <!-- road -->
    <line class="road" x1="0" y1="212" x2="900" y2="212"/>

    <!-- van -->
    <g transform="translate(0,168)"><g class="van">
      <g class="bounce">
        <rect x="0" y="0" width="64" height="32" rx="6" fill="#e31e24"/>
        <path d="M64 8 h14 l12 12 v12 h-26 z" fill="#c4161b"/>
        <path d="M70 12 h6 l8 8 h-14 z" fill="#cfe9ff"/>
        <rect x="10" y="8" width="30" height="10" rx="2" fill="#ffffff" opacity=".85"/>
        <circle cx="88" cy="26" r="2.5" fill="#ffd54a"/>
        <!-- wheels -->
        <g transform="translate(16,34)"><circle r="8" fill="#161616" stroke="#fff" stroke-width="2"/><line class="spin" x1="-5" y1="0" x2="5" y2="0" stroke="#fff" stroke-width="2"/></g>
        <g transform="translate(66,34)"><circle r="8" fill="#161616" stroke="#fff" stroke-width="2"/><line class="spin" x1="-5" y1="0" x2="5" y2="0" stroke="#fff" stroke-width="2"/></g>
      </g>
    </g></g>
  </g>
  <rect x="0.5" y="0.5" width="899" height="239" rx="18" fill="none" stroke="#2a2a2a"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
