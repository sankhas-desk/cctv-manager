<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Workflow: admin posts job, worker travels, worker reports, admin invoices, month-end report" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Service Manager workflow</title>
  <style>
    text{font-family:'Segoe UI',Inter,Arial,sans-serif}
    .line{stroke:#3a3a3a;stroke-width:4;stroke-linecap:round}
    .flow{stroke:#e31e24;stroke-width:4;stroke-linecap:round;stroke-dasharray:6 12;animation:flow .8s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-18}}
    .node{fill:#1b1b1b;stroke:#e31e24;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:glow 10s ease-in-out infinite}
    .n1{animation-delay:0s}.n2{animation-delay:2s}.n3{animation-delay:4s}.n4{animation-delay:6s}.n5{animation-delay:8s}
    @keyframes glow{0%{fill:#e31e24;transform:scale(1.18)}16%{fill:#e31e24;transform:scale(1.18)}24%,100%{fill:#1b1b1b;transform:scale(1)}}
    .num{fill:#fff;font-size:22px;font-weight:700;text-anchor:middle}
    .t{fill:#fff;font-size:15px;font-weight:600;text-anchor:middle}
    .s{fill:#a8abb0;font-size:12.5px;text-anchor:middle}
    .packet{fill:#ffd54a;animation:move 10s linear infinite}
    @keyframes move{0%{transform:translateX(0);opacity:1}80%{transform:translateX(720px);opacity:1}88%{transform:translateX(720px);opacity:0}100%{transform:translateX(0);opacity:0}}
    .tag{fill:#161616;stroke:#2c2c2c}
    .who{font-size:11px;font-weight:700;letter-spacing:.8px;text-anchor:middle}
  </style>
  <rect width="900" height="250" rx="18" fill="#0a0a0a"/>
  <rect x="0.5" y="0.5" width="899" height="249" rx="18" fill="none" stroke="#2a2a2a"/>

  <!-- track -->
  <line class="line" x1="90" y1="100" x2="810" y2="100"/>
  <line class="flow" x1="90" y1="100" x2="810" y2="100"/>

  <!-- who tags -->
  <g>
    <rect class="tag" x="55" y="26" width="70" height="22" rx="11"/><text class="who" x="90" y="41" fill="#e31e24">ADMIN</text>
    <rect class="tag" x="235" y="26" width="70" height="22" rx="11"/><text class="who" x="270" y="41" fill="#1e9e57">WORKER</text>
    <rect class="tag" x="415" y="26" width="70" height="22" rx="11"/><text class="who" x="450" y="41" fill="#1e9e57">WORKER</text>
    <rect class="tag" x="595" y="26" width="70" height="22" rx="11"/><text class="who" x="630" y="41" fill="#e31e24">ADMIN</text>
    <rect class="tag" x="775" y="26" width="70" height="22" rx="11"/><text class="who" x="810" y="41" fill="#e31e24">ADMIN</text>
  </g>

  <!-- moving packet (drawn under the nodes) -->
  <circle class="packet" cx="90" cy="100" r="6"/>

  <!-- nodes -->
  <circle class="node n1" cx="90"  cy="100" r="30"/><text class="num" x="90"  y="108">1</text>
  <circle class="node n2" cx="270" cy="100" r="30"/><text class="num" x="270" y="108">2</text>
  <circle class="node n3" cx="450" cy="100" r="30"/><text class="num" x="450" y="108">3</text>
  <circle class="node n4" cx="630" cy="100" r="30"/><text class="num" x="630" y="108">4</text>
  <circle class="node n5" cx="810" cy="100" r="30"/><text class="num" x="810" y="108">5</text>

  <!-- labels -->
  <text class="t" x="90"  y="164">Post the job</text>
  <text class="s" x="90"  y="184">title · phone · address</text>

  <text class="t" x="270" y="164">Go on site</text>
  <text class="s" x="270" y="184">start km saved</text>

  <text class="t" x="450" y="164">Report the work</text>
  <text class="s" x="450" y="184">what was done · who</text>
  <text class="s" x="450" y="201">end km saved</text>

  <text class="t" x="630" y="164">Invoice it</text>
  <text class="s" x="630" y="184">invoice number logged</text>

  <text class="t" x="810" y="164">Month-end CSV</text>
  <text class="s" x="810" y="184">jobs + mileage totals</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
