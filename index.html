<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>Service Manager</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#e31e24;
    --red-dark:#b71c1c;
    --red-soft:#fdecec;
    --black:#0a0a0a;
    --ink:#161616;
    --muted:#6b7075;
    --line:#e8e8ea;
    --bg:#f6f6f7;
    --card:#ffffff;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Arial,sans-serif;
    margin:0;background:var(--bg);color:var(--ink);
    font-size:15px;line-height:1.5;
  }

  /* ---------- Header ---------- */
  header{
    background:var(--black);color:#fff;
    padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;
    border-bottom:3px solid var(--red);
    position:sticky;top:0;z-index:5;
  }
  .brand{display:flex;align-items:center;gap:12px}
  .brand img{width:40px;height:40px;border-radius:50%;background:#fff;display:block}
  .brand b{font-size:16px;font-weight:600;letter-spacing:.2px;display:block;line-height:1.2}
  .brand small{color:#a8abb0;font-size:12.5px}

  main{max-width:820px;margin:0 auto;padding:20px 16px 60px}

  /* ---------- Cards ---------- */
  .card{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;
  }

  /* ---------- Buttons ---------- */
  button{
    font-family:inherit;font-size:14px;font-weight:500;
    padding:9px 16px;border:1px solid var(--black);border-radius:10px;
    background:var(--black);color:#fff;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s,transform .05s;
  }
  button:hover{background:#2a2a2a;border-color:#2a2a2a}
  button:active{transform:scale(.98)}
  button.green{background:var(--red);border-color:var(--red)}          /* primary action */
  button.green:hover{background:var(--red-dark);border-color:var(--red-dark)}
  button.grey{background:transparent;color:var(--ink);border-color:var(--line)}
  button.grey:hover{background:#f0f0f1;border-color:#d5d5d8}
  header button.grey{color:#fff;border-color:#3a3a3a}
  header button.grey:hover{background:#1e1e1e;border-color:#555}
  button.red{background:transparent;color:var(--red);border-color:#f3c3c5}
  button.red:hover{background:var(--red-soft);border-color:var(--red)}

  /* ---------- Inputs ---------- */
  input,textarea,select{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
    font-family:inherit;font-size:15px;margin:4px 0 12px;background:#fff;color:var(--ink);
    transition:border-color .15s,box-shadow .15s;
  }
  input:focus,textarea:focus,select:focus{
    outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(227,30,36,.12);
  }
  label{font-size:13px;font-weight:500;color:var(--muted)}
  label b{color:var(--ink);font-weight:600}

  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row>*{flex:0 0 auto}
  .hidden{display:none!important}
  .meta{font-size:13px;color:var(--muted);margin-top:6px}
  .err{color:var(--red);font-size:13.5px;margin:6px 0 0}

  /* ---------- Date bar ---------- */
  .datebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .datebar label{margin:0}
  .datebar input{width:auto;margin:0}
  #summary{margin:0 0 0 auto;font-weight:500;color:var(--ink)}

  /* ---------- Collapsible panels ---------- */
  details summary{
    cursor:pointer;font-weight:600;list-style:none;
    display:flex;align-items:center;justify-content:space-between;
  }
  details summary::-webkit-details-marker{display:none}
  details summary::after{content:"+";font-size:20px;color:var(--red);font-weight:400;line-height:1}
  details[open] summary::after{content:"–"}
  details[open] summary{margin-bottom:12px}
  details h4{margin:16px 0 8px;font-size:14px}

  /* ---------- Job cards ---------- */
  .task{position:relative;padding-left:22px}
  .task::before{
    content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;
  }
  .task.pending::before{background:var(--red)}
  .task.done::before{background:var(--black)}
  .task b{font-size:16px;font-weight:600}
  .badge{
    font-size:11.5px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;
    padding:3px 10px;border-radius:20px;
  }
  .badge.pending{background:var(--red-soft);color:var(--red)}
  .badge.done{background:var(--black);color:#fff}
  .task .row:last-child{margin-top:12px}

  /* ---------- Modal ---------- */
  .modal{
    position:fixed;inset:0;background:rgba(10,10,10,.55);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;padding:14px;z-index:10;
  }
  .modal .box{
    background:#fff;border-radius:18px;padding:22px;width:100%;max-width:480px;
    max-height:90vh;overflow:auto;border-top:4px solid var(--red);
  }
  .modal h3{margin:0 0 14px;font-size:18px}
  .checks{margin:4px 0 14px}
  .checks label{
    display:flex;align-items:center;padding:9px 12px;margin-bottom:6px;
    border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:14.5px;cursor:pointer;
  }
  .checks label:hover{background:#fafafa}
  .checks input{width:18px;height:18px;margin:0 10px 0 0;accent-color:var(--red)}

  /* ---------- Login ---------- */
  #loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-box{width:100%;max-width:370px;text-align:center}
  .login-box img{width:96px;height:96px;border-radius:50%;margin-bottom:14px}
  .login-box h2{margin:0 0 4px;font-size:22px}
  .login-box p.sub{color:var(--muted);margin:0 0 22px;font-size:14px}
  .login-box .card{text-align:left;padding:22px}
  .login-box button{width:100%;padding:12px;background:var(--red);border-color:var(--red)}
  .login-box button:hover{background:var(--red-dark);border-color:var(--red-dark)}

  @media (max-width:520px){
    main{padding:14px 12px 50px}
    #summary{margin-left:0;width:100%}
    header{padding:10px 14px}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<main id="loginView" class="hidden">
  <div class="login-box">
    <img src="logo.png" alt="Logo">
    <h2>Service Manager</h2>
    <p class="sub">Sign in to continue</p>
    <div class="card">
      <label>Email</label>
      <input id="email" type="email" placeholder="you@company.com">
      <label>Password</label>
      <input id="password" type="password" placeholder="••••••••">
      <button id="loginBtn">Sign in</button>
      <p class="err" id="loginErr"></p>
    </div>
  </div>
</main>

<!-- APP -->
<div id="appView" class="hidden">
  <header>
    <div class="brand">
      <img src="logo.png" alt="Logo">
      <div><b>Service Manager</b><small id="who"></small></div>
    </div>
    <button class="grey" id="logoutBtn">Logout</button>
  </header>
  <main>
    <div class="card datebar">
      <label><b>Date</b></label>
      <input type="date" id="dateSel">
      <button class="grey" id="todayBtn">Today</button>
      <span id="summary" class="meta"></span>
    </div>

    <!-- ADMIN ONLY -->
    <div id="adminPanel" class="hidden">
      <div class="card">
        <details open>
          <summary>Add jobs</summary>
          <label>One job per line</label>
          <textarea id="newTasks" rows="4" placeholder="School CCTV service&#10;Kamal's home CCTV service&#10;Shop DVR troubleshooting"></textarea>
          <button id="addTasksBtn" class="green">Post jobs to selected date</button>
        </details>
      </div>
      <div class="card">
        <details>
          <summary>Team members</summary>
          <div id="teamList" class="meta"></div>
          <h4>Add worker</h4>
          <input id="wName" placeholder="Worker name">
          <input id="wEmail" type="email" placeholder="Worker email (login)">
          <input id="wPass" type="text" placeholder="Password (min 6 chars)">
          <button id="addWorkerBtn">Create worker</button>
          <p class="err" id="wMsg"></p>
        </details>
      </div>
      <div class="card">
        <details>
          <summary>Export records (CSV)</summary>
          <div class="row">
            <input type="date" id="expFrom" style="width:auto;margin:0"> <span class="meta" style="margin:0">to</span>
            <input type="date" id="expTo" style="width:auto;margin:0">
            <button id="exportBtn">Download</button>
          </div>
        </details>
      </div>
    </div>

    <div id="taskList"></div>
  </main>
</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
  <div class="box">
    <h3 id="mTitle"></h3>
    <div id="adminFields" class="hidden">
      <label>Job title</label><input id="mJob">
      <label>Notes / location (optional)</label><textarea id="mNotes" rows="2"></textarea>
    </div>
    <label><b>What was done?</b></label>
    <textarea id="mWork" rows="4" placeholder="Describe the work you did..."></textarea>
    <label><b>Who attended?</b></label>
    <div id="mChecks" class="checks"></div>
    <div id="adminStatus" class="hidden">
      <label>Status</label>
      <select id="mStatus"><option value="pending">Pending</option><option value="done">Done</option></select>
    </div>
    <p class="err" id="mErr"></p>
    <div class="row" style="margin-top:12px">
      <button class="green" id="mSave">Save</button>
      <button class="grey" id="mCancel">Cancel</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, createUserWithEmailAndPassword }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc,
         query, where, onSnapshot, getDocs, serverTimestamp, Timestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ====== PASTE YOUR FIREBASE CONFIG HERE ====== */

const firebaseConfig = {
    apiKey: "AIzaSyAOX-OOJWVub_cjNbec09ertHpAwOv7YF4",
    authDomain: "pentech-cctv-service-manager.firebaseapp.com",
    projectId: "pentech-cctv-service-manager",
    storageBucket: "pentech-cctv-service-manager.firebasestorage.app",
    messagingSenderId: "944729312128",
    appId: "1:944729312128:web:347904b86bce665dc6cf65",
    measurementId: "G-8BYTGT2RSE"
  };
/* ============================================= */

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = () => new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD

let me = null, isAdmin = false, staff = [], tasks = [], unsubTasks = null, unsubUsers = null, editingId = null;

/* ---------- AUTH ---------- */
$('loginBtn').onclick = async () => {
  $('loginErr').textContent = '';
  try { await signInWithEmailAndPassword(auth, $('email').value.trim(), $('password').value); }
  catch (e) { $('loginErr').textContent = 'Login failed: check email/password.'; }
};
$('logoutBtn').onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  if (unsubTasks) unsubTasks(); if (unsubUsers) unsubUsers();
  if (!user) { me = null; show('loginView'); return; }
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (!snap.exists() || !snap.data().active) {
    alert('Your account has no access. Contact the admin.');
    return signOut(auth);
  }
  me = { uid: user.uid, ...snap.data() };
  isAdmin = me.role === 'admin';
  $('who').textContent = `${me.name} (${isAdmin ? 'Admin' : 'Worker'})`;
  $('adminPanel').classList.toggle('hidden', !isAdmin);
  $('dateSel').value = todayStr();
  show('appView');
  unsubUsers = onSnapshot(collection(db, 'users'), s => {
    staff = s.docs.map(d => ({ id: d.id, ...d.data() }));
    renderTeam();
  });
  listenTasks();
});

function show(view) {
  $('loginView').classList.toggle('hidden', view !== 'loginView');
  $('appView').classList.toggle('hidden', view !== 'appView');
}

/* ---------- TASKS ---------- */
function listenTasks() {
  if (unsubTasks) unsubTasks();
  const q = query(collection(db, 'tasks'), where('date', '==', $('dateSel').value));
  unsubTasks = onSnapshot(q, s => {
    tasks = s.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.createdAt?.seconds ?? 0) - (b.createdAt?.seconds ?? 0));
    renderTasks();
  });
}
$('dateSel').onchange = listenTasks;
$('todayBtn').onclick = () => { $('dateSel').value = todayStr(); listenTasks(); };

function renderTasks() {
  const done = tasks.filter(t => t.status === 'done').length;
  $('summary').textContent = tasks.length ? `${done} of ${tasks.length} completed` : '';
  if (!tasks.length) { $('taskList').innerHTML = '<div class="card meta">No jobs posted for this date.</div>'; return; }
  $('taskList').innerHTML = tasks.map(t => `
    <div class="card task ${t.status}">
      <div class="row" style="justify-content:space-between">
        <b>${esc(t.title)}</b>
        <span class="badge ${t.status}">${t.status === 'done' ? '✔ Done' : 'Pending'}</span>
      </div>
      ${t.notes ? `<div class="meta">${esc(t.notes)}</div>` : ''}
      ${t.status === 'done' ? `
        <div style="margin-top:8px"><b style="font-size:14px">Work done:</b> ${esc(t.workDone).replace(/\n/g,'<br>')}</div>
        <div class="meta">Attended: ${esc((t.attendedBy || []).join(', '))}<br>
        Submitted by ${esc(t.completedByName)} • ${t.completedAt ? t.completedAt.toDate().toLocaleString() : ''}</div>` : ''}
      <div class="row">
        ${t.status === 'pending' ? `<button class="green" data-act="done" data-id="${t.id}">Mark done / report</button>` : ''}
        ${isAdmin ? `<button class="grey" data-act="edit" data-id="${t.id}">Edit</button>
                     <button class="red" data-act="del" data-id="${t.id}">Delete</button>` : ''}
      </div>
    </div>`).join('');
}

$('taskList').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  const t = tasks.find(x => x.id === b.dataset.id); if (!t) return;
  if (b.dataset.act === 'del') {
    if (confirm(`Delete "${t.title}"?`)) await deleteDoc(doc(db, 'tasks', t.id));
  } else openModal(t, b.dataset.act);
};

/* ---------- ADMIN: add jobs ---------- */
$('addTasksBtn').onclick = async () => {
  const lines = $('newTasks').value.split('\n').map(s => s.trim()).filter(Boolean);
  if (!lines.length) return;
  const date = $('dateSel').value;
  const expire = new Date(date); expire.setDate(expire.getDate() + 400);
  for (const title of lines) {
    await addDoc(collection(db, 'tasks'), {
      date, title, notes: '', status: 'pending', workDone: '', attendedBy: [],
      createdAt: serverTimestamp(), createdBy: me.uid,
      expireAt: Timestamp.fromDate(expire)   // only used if you enable optional TTL
    });
  }
  $('newTasks').value = '';
};

/* ---------- MODAL ---------- */
function openModal(t, mode) {
  editingId = t.id;
  $('mErr').textContent = '';
  $('mTitle').textContent = mode === 'edit' ? 'Edit job' : t.title;
  $('adminFields').classList.toggle('hidden', mode !== 'edit');
  $('adminStatus').classList.toggle('hidden', mode !== 'edit');
  $('mJob').value = t.title; $('mNotes').value = t.notes || '';
  $('mWork').value = t.workDone || ''; $('mStatus').value = t.status;
  const attended = t.attendedBy || [];
  $('mChecks').innerHTML = staff.filter(s => s.active).map(s =>
    `<label><input type="checkbox" value="${esc(s.name)}" ${attended.includes(s.name) ? 'checked' : ''}>${esc(s.name)}</label>`).join('');
  $('modal').classList.remove('hidden');
  $('modal').dataset.mode = mode;
}
$('mCancel').onclick = () => $('modal').classList.add('hidden');

$('mSave').onclick = async () => {
  const mode = $('modal').dataset.mode;
  const work = $('mWork').value.trim();
  const attended = [...$('mChecks').querySelectorAll('input:checked')].map(i => i.value);
  try {
    if (mode === 'edit') {
      const status = $('mStatus').value;
      const data = { title: $('mJob').value.trim(), notes: $('mNotes').value.trim(),
                     workDone: work, attendedBy: attended, status };
      if (status === 'done') { data.completedAt = serverTimestamp(); data.completedBy = me.uid; data.completedByName = me.name; }
      await updateDoc(doc(db, 'tasks', editingId), data);
    } else {
      if (!work) return $('mErr').textContent = 'Please describe what was done.';
      if (!attended.length) return $('mErr').textContent = 'Select who attended.';
      await updateDoc(doc(db, 'tasks', editingId), {
        status: 'done', workDone: work, attendedBy: attended,
        completedAt: serverTimestamp(), completedBy: me.uid, completedByName: me.name
      });
    }
    $('modal').classList.add('hidden');
  } catch (e) { $('mErr').textContent = 'Save failed: ' + e.message; }
};

/* ---------- ADMIN: team ---------- */
function renderTeam() {
  if (!isAdmin) return;
  $('teamList').innerHTML = staff.map(s => `
    <div class="row" style="margin:6px 0;justify-content:space-between">
      <span>${esc(s.name)} — ${esc(s.email)} (${s.role})${s.active ? '' : ' <i>[disabled]</i>'}</span>
      ${s.id !== me.uid ? `<button class="grey" data-uid="${s.id}" data-active="${s.active}">${s.active ? 'Disable' : 'Enable'}</button>` : ''}
    </div>`).join('');
}
$('teamList').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  await updateDoc(doc(db, 'users', b.dataset.uid), { active: b.dataset.active !== 'true' });
};

$('addWorkerBtn').onclick = async () => {
  const name = $('wName').value.trim(), email = $('wEmail').value.trim(), pass = $('wPass').value;
  $('wMsg').textContent = '';
  if (!name || !email || pass.length < 6) return $('wMsg').textContent = 'Fill all fields (password min 6).';
  try {
    // secondary app so the admin stays logged in
    const second = initializeApp(firebaseConfig, 'secondary' + Date.now());
    const cred = await createUserWithEmailAndPassword(getAuth(second), email, pass);
    await setDoc(doc(db, 'users', cred.user.uid), { name, email, role: 'worker', active: true });
    await signOut(getAuth(second));
    $('wName').value = $('wEmail').value = $('wPass').value = '';
    $('wMsg').style.color = '#1e9e57'; $('wMsg').textContent = 'Worker created.';
  } catch (e) { $('wMsg').style.color = ''; $('wMsg').textContent = e.message; }
};

/* ---------- ADMIN: export ---------- */
$('exportBtn').onclick = async () => {
  const from = $('expFrom').value, to = $('expTo').value;
  if (!from || !to) return alert('Choose both dates');
  const s = await getDocs(query(collection(db, 'tasks'), where('date', '>=', from), where('date', '<=', to)));
  const rows = s.docs.map(d => d.data()).sort((a, b) => a.date.localeCompare(b.date));
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = ['Date,Job,Notes,Status,Work Done,Attended By,Submitted By,Completed At']
    .concat(rows.map(r => [r.date, r.title, r.notes, r.status, r.workDone, (r.attendedBy || []).join('; '),
      r.completedByName, r.completedAt ? r.completedAt.toDate().toLocaleString() : ''].map(q).join(','))).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `cctv-records_${from}_to_${to}.csv`; a.click();
};
</script>
</body>
</html>
