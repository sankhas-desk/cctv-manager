<!DOCTYPE html>
<!-- Service Manager | Version 1.8 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>Service Manager</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#e31e24;
    --red-dark:#b71c1c;
    --red-soft:#fdecec;
    --green:#1e9e57;
    --green-dark:#17804a;
    --green-soft:#e6f6ed;
    --orange:#f5a000;
    --orange-text:#a86400;
    --orange-soft:#fff3d6;
    --black:#0a0a0a;
    --ink:#161616;
    --muted:#6b7075;
    --line:#e8e8ea;
    --bg:#f6f6f7;
    --card:#ffffff;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Arial,sans-serif;
    margin:0;background:var(--bg);color:var(--ink);
    font-size:15px;line-height:1.5;
    min-height:100vh;display:flex;flex-direction:column;
  }
  #appView{flex:1 0 auto}

  /* ---------- Header ---------- */
  header{
    background:var(--black);color:#fff;
    padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;
    border-bottom:3px solid var(--red);
    position:sticky;top:0;z-index:5;
  }
  .brand{display:flex;align-items:center;gap:12px}
  .brand img{width:40px;height:40px;border-radius:50%;background:#fff;display:block}
  .brand b{font-size:16px;font-weight:600;letter-spacing:.2px;display:block;line-height:1.2}
  .brand small{color:#a8abb0;font-size:12.5px}

  main{max-width:820px;margin:0 auto;padding:20px 16px 40px}

  /* ---------- Footer ---------- */
  footer{
    background:var(--black);color:#a8abb0;text-align:center;
    padding:18px 16px;font-size:12.5px;line-height:1.7;
    border-top:3px solid var(--red);flex-shrink:0;
  }
  footer div:first-child{color:#fff;font-weight:500}

  /* ---------- Cards ---------- */
  .card{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;
  }

  /* ---------- Buttons ---------- */
  button{
    font-family:inherit;font-size:14px;font-weight:500;
    padding:9px 16px;border:1px solid var(--black);border-radius:10px;
    background:var(--black);color:#fff;cursor:pointer;
    transition:background .15s,color .15s,border-color .15s,transform .05s;
  }
  button:hover{background:#2a2a2a;border-color:#2a2a2a}
  button:active{transform:scale(.98)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.primary{background:var(--red);border-color:var(--red)}
  button.primary:hover{background:var(--red-dark);border-color:var(--red-dark)}
  button.green{background:var(--green);border-color:var(--green)}
  button.green:hover{background:var(--green-dark);border-color:var(--green-dark)}
  button.grey{background:transparent;color:var(--ink);border-color:var(--line)}
  button.grey:hover{background:#f0f0f1;border-color:#d5d5d8}
  header button.grey{color:#fff;border-color:#3a3a3a}
  header button.grey:hover{background:#1e1e1e;border-color:#555}
  button.red{background:transparent;color:var(--red);border-color:#f3c3c5}
  button.red:hover{background:var(--red-soft);border-color:var(--red)}

  /* ---------- Inputs ---------- */
  input,textarea,select{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
    font-family:inherit;font-size:15px;margin:4px 0 12px;background:#fff;color:var(--ink);
    transition:border-color .15s,box-shadow .15s;
  }
  input:focus,textarea:focus,select:focus{
    outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(227,30,36,.12);
  }
  label{font-size:13px;font-weight:500;color:var(--muted)}
  label b{color:var(--ink);font-weight:600}

  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row>*{flex:0 0 auto}
  .hidden{display:none!important}
  .meta{font-size:13px;color:var(--muted);margin-top:6px}
  .meta a{color:var(--ink);font-weight:500}
  .err{color:var(--red);font-size:13.5px;margin:6px 0 0}

  /* ---------- Add-job rows ---------- */
  .jobrow{display:grid;grid-template-columns:1fr 180px 42px;gap:8px;margin-bottom:8px}
  .jobrow input{margin:0}
  .jobrow .ja{grid-column:1 / -1}
  .jobrow button{padding:0;width:42px}
  @media (max-width:520px){
    .jobrow{grid-template-columns:1fr 42px}
    .jobrow .jp{grid-column:1;grid-row:2}
    .jobrow .ja{grid-column:1;grid-row:3}
  }

  /* ---------- Date bar ---------- */
  .datebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .datebar label{margin:0}
  .datebar input{width:auto;margin:0}

  /* ---------- Progress meter ---------- */
  .progress-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .progress-head b{font-size:14px;font-weight:600}
  #pctText{font-size:22px;font-weight:700;line-height:1}
  .bar{height:12px;background:#ececee;border-radius:20px;overflow:hidden;margin:10px 0 6px}
  #barFill{height:100%;width:0;border-radius:20px;transition:width .5s ease,background .3s}
  .progress.red    #barFill{background:var(--red)}
  .progress.orange #barFill{background:var(--orange)}
  .progress.green  #barFill{background:var(--green)}
  .progress.red    #pctText{color:var(--red)}
  .progress.orange #pctText{color:var(--orange-text)}
  .progress.green  #pctText{color:var(--green)}
  #summary{margin:0}

  /* ---------- Collapsible panels ---------- */
  details summary{
    cursor:pointer;font-weight:600;list-style:none;
    display:flex;align-items:center;justify-content:space-between;
  }
  details summary::-webkit-details-marker{display:none}
  details summary::after{content:"+";font-size:20px;color:var(--red);font-weight:400;line-height:1}
  details[open] summary::after{content:"–"}
  details[open] summary{margin-bottom:12px}
  details h4{margin:16px 0 8px;font-size:14px}

  /* ---------- Job cards ---------- */
  .task{position:relative;padding-left:22px}
  .task::before{
    content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;
  }
  .task.pending::before{background:var(--orange)}
  .task.done::before{background:var(--green)}
  .task.done{background:#fcfefd}
  .task b{font-size:16px;font-weight:600}
  .badges{display:flex;gap:6px;flex-wrap:wrap}
  .badge{
    font-size:11.5px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;
    padding:3px 10px;border-radius:20px;white-space:nowrap;
  }
  .badge.pending{background:var(--orange-soft);color:var(--orange-text)}
  .badge.done{background:var(--green);color:#fff}
  .badge.inv{background:var(--black);color:#fff}
  .badge.noinv{background:var(--red-soft);color:var(--red)}
  .task .row:last-child{margin-top:12px}

  /* ---------- Modal ---------- */
  .modal{
    position:fixed;inset:0;background:rgba(10,10,10,.55);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;padding:14px;z-index:10;
  }
  .modal .box{
    background:#fff;border-radius:18px;padding:22px;width:100%;max-width:480px;
    max-height:90vh;overflow:auto;border-top:4px solid var(--red);
  }
  .modal h3{margin:0 0 14px;font-size:18px}
  .checks{margin:4px 0 14px}
  .checks label{
    display:flex;align-items:center;padding:9px 12px;margin-bottom:6px;
    border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:14.5px;cursor:pointer;
  }
  .checks label:hover{background:#fafafa}
  .checks input{width:18px;height:18px;margin:0 10px 0 0;accent-color:var(--green)}

  /* ---------- Vehicle mileage ---------- */
  .milerow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .km-total{
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;
    background:var(--green-soft);border:1px solid #c9ead7;border-radius:12px;padding:12px 14px;margin:6px 0 12px;
  }
  .km-total span{font-size:13px;color:var(--muted);font-weight:500}
  .km-total b{font-size:22px;font-weight:700;color:var(--green)}
  .km-wrap{overflow-x:auto}
  table.km{width:100%;border-collapse:collapse;font-size:13.5px}
  table.km th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.3px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  table.km td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
  table.km td.n,table.km th.n{text-align:right}
  .km-sub{margin:14px 0 6px;font-size:14px;font-weight:600}
  .ver{opacity:.8}

  /* ---------- Login ---------- */
  #loginView{flex:1 0 auto;width:100%;max-width:none;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-box{width:100%;max-width:370px;text-align:center}
  .login-box img{width:96px;height:96px;border-radius:50%;margin-bottom:14px}
  .login-box h2{margin:0 0 4px;font-size:22px}
  .login-box p.sub{color:var(--muted);margin:0 0 22px;font-size:14px}
  .login-box .card{text-align:left;padding:22px}
  .login-box button{width:100%;padding:12px}
  .login-ver{margin-top:14px;font-size:12px;color:var(--muted)}

  @media (max-width:520px){
    main{padding:14px 12px 30px}
    header{padding:10px 14px}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<main id="loginView" class="hidden">
  <div class="login-box">
    <img src="logo.png" alt="Logo">
    <h2>Service Manager</h2>
    <p class="sub">Sign in to continue</p>
    <div class="card">
      <label>Email</label>
      <input id="email" type="email" placeholder="you@company.com">
      <label>Password</label>
      <input id="password" type="password" placeholder="••••••••">
      <button id="loginBtn" class="primary">Sign in</button>
      <p class="err" id="loginErr"></p>
    </div>
    <div class="login-ver">Version <span class="appVer"></span></div>
  </div>
</main>

<!-- APP -->
<div id="appView" class="hidden">
  <header>
    <div class="brand">
      <img src="logo.png" alt="Logo">
      <div><b>Service Manager</b><small id="who"></small></div>
    </div>
    <button class="grey" id="logoutBtn">Logout</button>
  </header>
  <main>
    <div class="card datebar">
      <label><b>Date</b></label>
      <input type="date" id="dateSel">
      <button class="grey" id="todayBtn">Today</button>
    </div>

    <!-- DAILY PROGRESS -->
    <div class="card progress hidden" id="progressCard">
      <div class="progress-head">
        <b>Daily progress</b>
        <span id="pctText">0%</span>
      </div>
      <div class="bar"><div id="barFill"></div></div>
      <div id="summary" class="meta"></div>
    </div>

    <!-- ADMIN ONLY -->
    <div id="adminPanel" class="hidden">
      <div class="card">
        <details open>
          <summary>Add jobs</summary>
          <div id="jobRows"></div>
          <div class="row" style="margin-top:6px">
            <button class="grey" id="addRowBtn" type="button">+ Add another job</button>
            <button id="addTasksBtn" class="primary">Post jobs to selected date</button>
          </div>
        </details>
      </div>
      <div class="card">
        <details>
          <summary>Team members</summary>
          <div id="teamList" class="meta"></div>
          <h4>Add worker</h4>
          <input id="wName" placeholder="Worker name">
          <input id="wEmail" type="email" placeholder="Worker email (login)">
          <input id="wPass" type="text" placeholder="Password (min 6 chars)">
          <button id="addWorkerBtn">Create worker</button>
          <p class="err" id="wMsg"></p>
        </details>
      </div>
      <div class="card">
        <details>
          <summary>Export records (CSV)</summary>
          <div class="row">
            <input type="date" id="expFrom" style="width:auto;margin:0"> <span class="meta" style="margin:0">to</span>
            <input type="date" id="expTo" style="width:auto;margin:0">
            <button id="exportBtn">Download</button>
          </div>
        </details>
      </div>
    </div>

    <div id="taskList"></div>

    <!-- VEHICLE MILEAGE (bottom of page) -->
    <div class="card" id="mileageCard">
      <details open>
        <summary>Vehicle mileage</summary>
        <div class="meta" id="kmDateLbl" style="margin:0 0 8px"></div>
        <div class="milerow">
          <div><label for="kmStart"><b>Start km</b> (odometer)</label>
            <input id="kmStart" type="number" inputmode="decimal" min="0" step="any" placeholder="e.g. 45210"></div>
          <div><label for="kmEnd"><b>End km</b> (odometer)</label>
            <input id="kmEnd" type="number" inputmode="decimal" min="0" step="any" placeholder="e.g. 45286"></div>
        </div>
        <div class="row">
          <button class="green" id="kmSaveBtn">Save mileage</button>
          <span class="meta" id="kmDay" style="margin:0"></span>
        </div>
        <p class="err" id="kmMsg"></p>

        <div class="km-total">
          <span id="kmMonthLbl">This month</span>
          <b id="kmMonthTotal">0 km</b>
        </div>
        <div id="kmByWorker"></div>
        <div id="kmList"></div>
      </details>
    </div>
  </main>
</div>

<!-- FOOTER -->
<footer>
  <div>© Pentech Technologies. All rights reserved.</div>
  <div>Designed and Developed by Sankha Mudhitha</div>
  <div class="ver">Version <span class="appVer"></span></div>
</footer>

<!-- MODAL -->
<div id="modal" class="modal hidden">
  <div class="box">
    <h3 id="mTitle"></h3>

    <!-- admin: edit job details -->
    <div id="adminFields" class="hidden">
      <label>Job title</label><input id="mJob">
      <label>Phone number</label><input id="mPhone" type="tel" inputmode="tel">
      <label>Job address <span style="color:var(--red)">*</span></label><input id="mAddress" placeholder="Address of the job site">
      <label>Notes (optional)</label><textarea id="mNotes" rows="2"></textarea>
    </div>

    <!-- worker report fields -->
    <div id="workFields">
      <label><b>What was done?</b></label>
      <textarea id="mWork" rows="4" placeholder="Describe the work you did..."></textarea>
      <label><b>Who attended?</b></label>
      <div id="mChecks" class="checks"></div>
    </div>

    <!-- admin: invoice -->
    <div id="invoiceFields" class="hidden">
      <label><b>Invoice number</b></label>
      <input id="mInvNo" placeholder="e.g. INV-1042">
    </div>

    <div id="adminStatus" class="hidden">
      <label>Status</label>
      <select id="mStatus"><option value="pending">Pending</option><option value="done">Done</option></select>
    </div>

    <p class="err" id="mErr"></p>
    <div class="row" style="margin-top:12px">
      <button class="green" id="mSave">Save</button>
      <button class="grey" id="mCancel">Cancel</button>
      <button class="red hidden" id="mRemoveInv">Remove invoice mark</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, createUserWithEmailAndPassword }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc,
         query, where, onSnapshot, getDocs, serverTimestamp, Timestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ====== PASTE YOUR FIREBASE CONFIG HERE ====== */

const firebaseConfig = {
    apiKey: "AIzaSyAOX-OOJWVub_cjNbec09ertHpAwOv7YF4",
    authDomain: "pentech-cctv-service-manager.firebaseapp.com",
    projectId: "pentech-cctv-service-manager",
    storageBucket: "pentech-cctv-service-manager.firebasestorage.app",
    messagingSenderId: "944729312128",
    appId: "1:944729312128:web:347904b86bce665dc6cf65",
    measurementId: "G-8BYTGT2RSE"
  };
/* ============================================= */

const APP_VERSION = '1.8';
document.querySelectorAll('.appVer').forEach(e => e.textContent = APP_VERSION);

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = () => new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD

let me = null, isAdmin = false, staff = [], tasks = [], unsubTasks = null, unsubUsers = null, editingId = null;
let mileage = [], unsubMile = null, mileMonth = null;

/* ---------- AUTH ---------- */
$('loginBtn').onclick = async () => {
  $('loginErr').textContent = '';
  try { await signInWithEmailAndPassword(auth, $('email').value.trim(), $('password').value); }
  catch (e) { $('loginErr').textContent = 'Login failed: check email/password.'; }
};
$('logoutBtn').onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  if (unsubTasks) unsubTasks(); if (unsubUsers) unsubUsers(); if (unsubMile) unsubMile();
  unsubMile = null; mileMonth = null; mileage = [];
  if (!user) { me = null; show('loginView'); return; }
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (!snap.exists() || !snap.data().active) {
    alert('Your account has no access. Contact the admin.');
    return signOut(auth);
  }
  me = { uid: user.uid, ...snap.data() };
  isAdmin = me.role === 'admin';
  $('who').textContent = `${me.name} (${isAdmin ? 'Admin' : 'Worker'})`;
  $('adminPanel').classList.toggle('hidden', !isAdmin);
  $('dateSel').value = todayStr();
  show('appView');
  unsubUsers = onSnapshot(collection(db, 'users'), s => {
    staff = s.docs.map(d => ({ id: d.id, ...d.data() }));
    renderTeam();
  });
  listenTasks();
  listenMileage();
});

function show(view) {
  $('loginView').classList.toggle('hidden', view !== 'loginView');
  $('appView').classList.toggle('hidden', view !== 'appView');
}

/* ---------- TASKS ---------- */
/* Admin order : completed-but-not-invoiced → pending → invoiced
   Worker order: pending → done                                   */
const rank = t => {
  if (isAdmin) {
    if (t.status === 'done' && !t.invoiced) return 0;
    if (t.status !== 'done') return 1;
    return 2;
  }
  return t.status === 'done' ? 1 : 0;
};
const stamp = t => ((t.status === 'done' ? t.completedAt : t.createdAt)?.seconds) ?? Number.MAX_SAFE_INTEGER;

function listenTasks() {
  if (unsubTasks) unsubTasks();
  const q = query(collection(db, 'tasks'), where('date', '==', $('dateSel').value));
  unsubTasks = onSnapshot(q, s => {
    tasks = s.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => rank(a) - rank(b) || stamp(a) - stamp(b));
    renderTasks();
  });
}
$('dateSel').onchange = () => { listenTasks(); listenMileage(); };
$('todayBtn').onclick = () => { $('dateSel').value = todayStr(); listenTasks(); listenMileage(); };

function renderProgress() {
  const total = tasks.length;
  const card = $('progressCard');
  if (!total) { card.classList.add('hidden'); $('summary').textContent = ''; return; }
  const done = tasks.filter(t => t.status === 'done').length;
  const pct = (done / total) * 100;
  const level = pct < 40 ? 'red' : (pct >= 90 ? 'green' : 'orange');
  card.classList.remove('hidden', 'red', 'orange', 'green');
  card.classList.add(level);
  $('pctText').textContent = Math.round(pct) + '%';
  $('barFill').style.width = pct + '%';
  $('summary').textContent = `${done} of ${total} jobs completed` +
    (done < total ? ` • ${total - done} pending` : ' • All done 🎉');
}

function renderTasks() {
  renderProgress();
  if (!tasks.length) { $('taskList').innerHTML = '<div class="card meta">No jobs posted for this date.</div>'; return; }
  $('taskList').innerHTML = tasks.map(t => {
    const isDone = t.status === 'done';
    const tel = String(t.phone || '').replace(/[^\d+]/g, '');
    return `
    <div class="card task ${t.status}">
      <div class="row" style="justify-content:space-between;align-items:flex-start">
        <b>${esc(t.title)}</b>
        <div class="badges">
          <span class="badge ${t.status}">${isDone ? '✔ Done' : 'Pending'}</span>
          ${isAdmin && isDone ? (t.invoiced
              ? '<span class="badge inv">Invoiced</span>'
              : '<span class="badge noinv">Not invoiced</span>') : ''}
        </div>
      </div>
      ${t.phone ? `<div class="meta">Phone: <a href="tel:${esc(tel)}">${esc(t.phone)}</a></div>` : ''}
      ${t.address ? `<div class="meta">📍 Address: <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(t.address)}" target="_blank" rel="noopener">${esc(t.address)}</a></div>` : ''}
      ${t.notes ? `<div class="meta">${esc(t.notes)}</div>` : ''}
      ${isDone ? `
        <div style="margin-top:8px"><b style="font-size:14px">Work done:</b> ${esc(t.workDone).replace(/\n/g,'<br>')}</div>
        <div class="meta">Attended: ${esc((t.attendedBy || []).join(', '))}<br>
        Submitted by ${esc(t.completedByName)} • ${t.completedAt ? t.completedAt.toDate().toLocaleString() : ''}</div>` : ''}
      ${isAdmin && isDone && t.invoiced ? `
        <div class="meta"><b style="color:var(--ink)">Invoice no:</b> ${esc(t.invoiceNo)}${t.invoicedAt ? ' • ' + t.invoicedAt.toDate().toLocaleString() : ''}</div>` : ''}
      <div class="row">
        ${t.status === 'pending' ? `<button class="green" data-act="done" data-id="${t.id}">Mark done / report</button>` : ''}
        ${isAdmin && isDone ? `<button class="${t.invoiced ? 'grey' : 'primary'}" data-act="invoice" data-id="${t.id}">${t.invoiced ? 'Edit invoice' : 'Mark invoiced'}</button>` : ''}
        ${isAdmin ? `<button class="grey" data-act="edit" data-id="${t.id}">Edit</button>
                     <button class="red" data-act="del" data-id="${t.id}">Delete</button>` : ''}
      </div>
    </div>`;
  }).join('');
}

$('taskList').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  const t = tasks.find(x => x.id === b.dataset.id); if (!t) return;
  if (b.dataset.act === 'del') {
    if (confirm(`Delete "${t.title}"?`)) await deleteDoc(doc(db, 'tasks', t.id));
  } else openModal(t, b.dataset.act);
};

/* ---------- ADMIN: add jobs (title + phone per row) ---------- */
function addRow() {
  const d = document.createElement('div');
  d.className = 'jobrow';
  d.innerHTML = `<input class="jt" placeholder="Job (e.g. School CCTV service)">
                 <input class="jp" type="tel" inputmode="tel" placeholder="Phone number">
                 <button type="button" class="grey" title="Remove">✕</button>
                 <input class="ja" placeholder="Job address (required)">`;
  d.querySelector('button').onclick = () => {
    if ($('jobRows').children.length > 1) d.remove();
    else d.querySelectorAll('input').forEach(i => i.value = '');
  };
  $('jobRows').appendChild(d);
}
$('addRowBtn').onclick = addRow;
addRow();

$('addTasksBtn').onclick = async () => {
  const allRows = [...document.querySelectorAll('#jobRows .jobrow')].map(r => ({
    el: r,
    title: r.querySelector('.jt').value.trim(),
    phone: r.querySelector('.jp').value.trim(),
    address: r.querySelector('.ja').value.trim()
  }));
  allRows.forEach(r => r.el.querySelector('.ja').style.borderColor = '');
  const rows = allRows.filter(r => r.title);
  if (!rows.length) return;
  const missing = rows.filter(r => !r.address);
  if (missing.length) {
    missing.forEach(r => r.el.querySelector('.ja').style.borderColor = 'var(--red)');
    missing[0].el.querySelector('.ja').focus();
    return alert('Please enter the job address for every job before posting.');
  }
  const date = $('dateSel').value;
  const expire = new Date(date); expire.setDate(expire.getDate() + 400);
  $('addTasksBtn').disabled = true;
  try {
    for (const r of rows) {
      await addDoc(collection(db, 'tasks'), {
        date, title: r.title, phone: r.phone, address: r.address, notes: '',
        status: 'pending', workDone: '', attendedBy: [],
        invoiced: false, invoiceNo: '',
        createdAt: serverTimestamp(), createdBy: me.uid,
        expireAt: Timestamp.fromDate(expire)   // only used if you enable optional TTL
      });
    }
    $('jobRows').innerHTML = ''; addRow();
  } catch (e) { alert('Could not post jobs: ' + e.message); }
  $('addTasksBtn').disabled = false;
};

/* ---------- VEHICLE MILEAGE ----------
   One document per worker per day:  mileage/{uid}_{YYYY-MM-DD}
   Workers see their own km; the admin sees every worker + the combined total. */
const fmtKm = n => (Math.round((Number(n) || 0) * 10) / 10).toLocaleString(undefined, { maximumFractionDigits: 1 });
const monthLabel = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo - 1, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' }); };

function listenMileage() {
  if (!me) return;
  const month = ($('dateSel').value || todayStr()).slice(0, 7);
  if (month === mileMonth && unsubMile) { renderMileage(); return; }   // same month: nothing to re-fetch
  if (unsubMile) unsubMile();
  mileMonth = month; mileage = [];
  const q = isAdmin
    ? query(collection(db, 'mileage'), where('month', '==', month))
    : query(collection(db, 'mileage'), where('uid', '==', me.uid), where('month', '==', month));
  unsubMile = onSnapshot(q, s => {
    mileage = s.docs.map(d => d.data()).sort((a, b) => a.date.localeCompare(b.date) || String(a.name).localeCompare(String(b.name)));
    renderMileage();
  }, e => { $('kmMsg').style.color = ''; $('kmMsg').textContent = 'Could not load mileage: ' + e.message; });
  renderMileage();
}

function renderMileage() {
  if (!me) return;
  const date = $('dateSel').value, month = date.slice(0, 7);
  $('kmDateLbl').textContent = 'Enter the odometer reading for ' + date;

  // fill the inputs from the saved entry (unless the person is typing right now)
  const mine = mileage.find(m => m.uid === me.uid && m.date === date);
  if (document.activeElement !== $('kmStart') && document.activeElement !== $('kmEnd')) {
    $('kmStart').value = mine ? mine.startKm : '';
    $('kmEnd').value = mine && mine.endKm != null ? mine.endKm : '';
  }
  $('kmDay').textContent = !mine ? 'No mileage saved for this day.'
    : (mine.endKm != null ? `Driven today: ${fmtKm(mine.km)} km` : 'Start saved – add the end km when you finish.');

  // running totals (per worker, adding up day by day)
  const run = {};
  const rows = mileage.map(m => {
    run[m.uid] = (run[m.uid] || 0) + (Number(m.km) || 0);
    return { ...m, running: run[m.uid] };
  });
  const total = rows.reduce((a, m) => a + (Number(m.km) || 0), 0);
  $('kmMonthLbl').textContent = (isAdmin ? 'All workers – ' : 'Your total – ') + monthLabel(month);
  $('kmMonthTotal').textContent = fmtKm(total) + ' km';

  // admin: per-worker totals
  if (isAdmin && rows.length) {
    const by = {};
    rows.forEach(m => { by[m.uid] = by[m.uid] || { name: m.name, km: 0 }; by[m.uid].km += Number(m.km) || 0; });
    $('kmByWorker').innerHTML = `<div class="km-sub">Per worker</div><div class="km-wrap"><table class="km"><tbody>` +
      Object.values(by).sort((a, b) => String(a.name).localeCompare(String(b.name)))
        .map(w => `<tr><td>${esc(w.name)}</td><td class="n"><b>${fmtKm(w.km)} km</b></td></tr>`).join('') +
      `</tbody></table></div>`;
  } else $('kmByWorker').innerHTML = '';

  // daily list
  if (!rows.length) { $('kmList').innerHTML = '<div class="meta">No mileage recorded this month.</div>'; return; }
  $('kmList').innerHTML = `<div class="km-sub">Daily record</div><div class="km-wrap"><table class="km"><thead><tr>
      <th>Date</th>${isAdmin ? '<th>Worker</th>' : ''}<th class="n">Start</th><th class="n">End</th><th class="n">Km</th><th class="n">${isAdmin ? 'Worker total' : 'Month total'}</th>
    </tr></thead><tbody>` +
    rows.map(m => `<tr><td>${esc(m.date.slice(5))}</td>${isAdmin ? `<td>${esc(m.name)}</td>` : ''}
      <td class="n">${fmtKm(m.startKm)}</td><td class="n">${m.endKm != null ? fmtKm(m.endKm) : '—'}</td>
      <td class="n"><b>${m.endKm != null ? fmtKm(m.km) : '—'}</b></td><td class="n">${fmtKm(m.running)}</td></tr>`).join('') +
    `</tbody></table></div>`;
}

$('kmSaveBtn').onclick = async () => {
  const msg = $('kmMsg'); msg.style.color = ''; msg.textContent = '';
  const date = $('dateSel').value;
  const start = parseFloat($('kmStart').value);
  const endRaw = $('kmEnd').value.trim();
  const end = endRaw === '' ? null : parseFloat(endRaw);
  if (!date) { msg.textContent = 'Choose a date first.'; return; }
  if (isNaN(start) || start < 0) { msg.textContent = 'Enter the start mileage.'; return; }
  if (end !== null && (isNaN(end) || end < start)) { msg.textContent = 'End mileage cannot be less than the start mileage.'; return; }
  $('kmSaveBtn').disabled = true;
  try {
    await setDoc(doc(db, 'mileage', `${me.uid}_${date}`), {
      uid: me.uid, name: me.name, date, month: date.slice(0, 7),
      startKm: start, endKm: end, km: end === null ? 0 : Math.round((end - start) * 10) / 10,
      updatedAt: serverTimestamp()
    });
    msg.style.color = '#1e9e57'; msg.textContent = 'Mileage saved.';
    document.activeElement.blur();
    renderMileage();
  } catch (e) { msg.textContent = 'Could not save: ' + e.message; }
  $('kmSaveBtn').disabled = false;
};

/* ---------- MODAL ---------- */
function openModal(t, mode) {
  editingId = t.id;
  const edit = mode === 'edit', inv = mode === 'invoice';
  $('modal').dataset.mode = mode;
  $('mErr').textContent = '';
  $('mTitle').textContent = inv ? 'Invoice – ' + t.title : (edit ? 'Edit job' : t.title);
  $('adminFields').classList.toggle('hidden', !edit);
  $('adminStatus').classList.toggle('hidden', !edit);
  $('workFields').classList.toggle('hidden', inv);
  $('invoiceFields').classList.toggle('hidden', !inv);
  $('mRemoveInv').classList.toggle('hidden', !(inv && t.invoiced));
  $('mJob').value = t.title; $('mPhone').value = t.phone || ''; $('mAddress').value = t.address || ''; $('mNotes').value = t.notes || '';
  $('mWork').value = t.workDone || ''; $('mStatus').value = t.status;
  $('mInvNo').value = t.invoiceNo || '';
  const attended = t.attendedBy || [];
  $('mChecks').innerHTML = staff.filter(s => s.active).map(s =>
    `<label><input type="checkbox" value="${esc(s.name)}" ${attended.includes(s.name) ? 'checked' : ''}>${esc(s.name)}</label>`).join('');
  $('modal').classList.remove('hidden');
  if (inv) setTimeout(() => $('mInvNo').focus(), 50);
}
$('mCancel').onclick = () => $('modal').classList.add('hidden');

$('mRemoveInv').onclick = async () => {
  if (!confirm('Remove the invoice mark from this job?')) return;
  try {
    await updateDoc(doc(db, 'tasks', editingId), { invoiced: false, invoiceNo: '', invoicedAt: null, invoicedBy: null });
    $('modal').classList.add('hidden');
  } catch (e) { $('mErr').textContent = 'Failed: ' + e.message; }
};

$('mSave').onclick = async () => {
  const mode = $('modal').dataset.mode;
  try {
    if (mode === 'invoice') {
      const no = $('mInvNo').value.trim();
      if (!no) return $('mErr').textContent = 'Enter the invoice number.';
      await updateDoc(doc(db, 'tasks', editingId), {
        invoiced: true, invoiceNo: no, invoicedAt: serverTimestamp(), invoicedBy: me.uid
      });
    } else if (mode === 'edit') {
      const t = tasks.find(x => x.id === editingId);
      const title = $('mJob').value.trim();
      if (!title) return $('mErr').textContent = 'Job title cannot be empty.';
      const address = $('mAddress').value.trim();
      if (!address) return $('mErr').textContent = 'Job address is required.';
      const status = $('mStatus').value;
      const data = {
        title, phone: $('mPhone').value.trim(), address, notes: $('mNotes').value.trim(),
        workDone: $('mWork').value.trim(),
        attendedBy: [...$('mChecks').querySelectorAll('input:checked')].map(i => i.value),
        status
      };
      if (status === 'done' && t.status !== 'done') {
        data.completedAt = serverTimestamp(); data.completedBy = me.uid; data.completedByName = me.name;
      }
      if (status === 'pending') { data.invoiced = false; data.invoiceNo = ''; data.invoicedAt = null; }
      await updateDoc(doc(db, 'tasks', editingId), data);
    } else {
      const work = $('mWork').value.trim();
      const attended = [...$('mChecks').querySelectorAll('input:checked')].map(i => i.value);
      if (!work) return $('mErr').textContent = 'Please describe what was done.';
      if (!attended.length) return $('mErr').textContent = 'Select who attended.';
      await updateDoc(doc(db, 'tasks', editingId), {
        status: 'done', workDone: work, attendedBy: attended,
        completedAt: serverTimestamp(), completedBy: me.uid, completedByName: me.name
      });
    }
    $('modal').classList.add('hidden');
  } catch (e) { $('mErr').textContent = 'Save failed: ' + e.message; }
};

/* ---------- ADMIN: team ---------- */
function renderTeam() {
  if (!isAdmin) return;
  $('teamList').innerHTML = staff.map(s => `
    <div class="row" style="margin:6px 0;justify-content:space-between">
      <span>${esc(s.name)} — ${esc(s.email)} (${s.role})${s.active ? '' : ' <i>[disabled]</i>'}</span>
      ${s.id !== me.uid ? `<button class="grey" data-uid="${s.id}" data-active="${s.active}">${s.active ? 'Disable' : 'Enable'}</button>` : ''}
    </div>`).join('');
}
$('teamList').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  await updateDoc(doc(db, 'users', b.dataset.uid), { active: b.dataset.active !== 'true' });
};

$('addWorkerBtn').onclick = async () => {
  const name = $('wName').value.trim(), email = $('wEmail').value.trim(), pass = $('wPass').value;
  $('wMsg').textContent = '';
  if (!name || !email || pass.length < 6) return $('wMsg').textContent = 'Fill all fields (password min 6).';
  try {
    // secondary app so the admin stays logged in
    const second = initializeApp(firebaseConfig, 'secondary' + Date.now());
    const cred = await createUserWithEmailAndPassword(getAuth(second), email, pass);
    await setDoc(doc(db, 'users', cred.user.uid), { name, email, role: 'worker', active: true });
    await signOut(getAuth(second));
    $('wName').value = $('wEmail').value = $('wPass').value = '';
    $('wMsg').style.color = '#1e9e57'; $('wMsg').textContent = 'Worker created.';
  } catch (e) { $('wMsg').style.color = ''; $('wMsg').textContent = e.message; }
};

/* ---------- ADMIN: export ---------- */
$('exportBtn').onclick = async () => {
  const from = $('expFrom').value, to = $('expTo').value;
  if (!from || !to) return alert('Choose both dates');
  const s = await getDocs(query(collection(db, 'tasks'), where('date', '>=', from), where('date', '<=', to)));
  const rows = s.docs.map(d => d.data()).sort((a, b) => a.date.localeCompare(b.date));
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lines = ['Date,Job,Phone,Address,Notes,Status,Work Done,Attended By,Submitted By,Completed At,Invoiced,Invoice No']
    .concat(rows.map(r => [r.date, r.title, r.phone, r.address, r.notes, r.status, r.workDone, (r.attendedBy || []).join('; '),
      r.completedByName, r.completedAt ? r.completedAt.toDate().toLocaleString() : '',
      r.invoiced ? 'Yes' : 'No', r.invoiceNo].map(q).join(',')));

  // vehicle mileage section (same period)
  const ms = await getDocs(query(collection(db, 'mileage'), where('date', '>=', from), where('date', '<=', to)));
  const km = ms.docs.map(d => d.data()).sort((a, b) => a.date.localeCompare(b.date) || String(a.name).localeCompare(String(b.name)));
  lines.push('', 'VEHICLE MILEAGE', 'Date,Worker,Start km,End km,Km driven');
  km.forEach(m => lines.push([m.date, m.name, m.startKm, m.endKm ?? '', m.km].map(q).join(',')));
  const perWorker = {}; let grand = 0;
  km.forEach(m => { perWorker[m.name] = (perWorker[m.name] || 0) + (Number(m.km) || 0); grand += Number(m.km) || 0; });
  Object.keys(perWorker).sort().forEach(n => lines.push(['Total', n, '', '', Math.round(perWorker[n] * 10) / 10].map(q).join(',')));
  lines.push(['Total (all workers)', '', '', '', Math.round(grand * 10) / 10].map(q).join(','));
  lines.push('', q('Service Manager v' + APP_VERSION));
  const csv = lines.join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `cctv-records_${from}_to_${to}.csv`; a.click();
};
</script>
